[versions]
agp = "9.2.1"
junit = "4.13.2"
room = "2.8.5"
ksp = "2.3.13"
coroutines = "1.10.2"
robolectric = "4.17"
androidx-test = "1.7.0"
androidx-test-junit = "1.3.0"
compose-bom = "2026.09.00"
compose-compiler = "2.3.10"
activity = "1.13.0"
lifecycle = "2.11.0"
mediapipe = "1.2.0"
litertlm = "0.19.0"
tink = "1.23.0"

[libraries]
junit = { module = "junit:junit", version.ref = "junit" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
lifecycle-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
mediapipe-vision = { module = "com.google.mediapipe:tasks-vision", version.ref = "mediapipe" }
litertlm = { module = "com.google.ai.edge.litertlm:litertlm-android", version.ref = "litertlm" }
tink = { module = "com.google.crypto.tink:tink-android", version.ref = "tink" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "compose-compiler" }
